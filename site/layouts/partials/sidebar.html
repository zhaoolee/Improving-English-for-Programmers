<aside class="sidebar" id="sidebar" aria-label="系列目录">
  <div class="sidebar-head">
    <div class="sidebar-brand-row">
      <a class="site-brand" href="{{ "" | relURL }}"><img src="{{ "assets/icon.png" | relURL }}" width="42" height="42" alt=""><span>程序员英语<small>English for Programmers</small></span></a>
      <a class="github-link" href="{{ site.Params.repository }}" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看程序员英语项目" title="在 GitHub 查看项目"><span aria-hidden="true"></span></a>
    </div>
    <label class="sidebar-search"><span aria-hidden="true">⌕</span><input type="search" id="category-filter" placeholder="查找系列…" aria-label="查找系列"></label>
    <a class="all-categories {{ if .IsHome }}active{{ end }}" href="{{ "" | relURL }}"><span>▦ &nbsp; 全部系列</span><span>{{ hugo.Data.catalog.total }}</span></a>
    <div class="sidebar-caption"><span>系列目录</span><span>{{ len hugo.Data.catalog.categories }} 个系列</span></div>
  </div>
  <nav class="sidebar-nav"><ul>
  {{ range hugo.Data.catalog.categories }}
    <li data-category-label="{{ .folder }} {{ .title }}"><a href="{{ .url | relURL }}" {{ if eq $.Params.series .slug }}aria-current="page"{{ end }}><span class="category-number">{{ .number | default "·" }}</span><span class="category-title">{{ .title }}</span></a></li>
  {{ end }}
  </ul><p id="no-categories" class="sidebar-empty" hidden>没有匹配的系列</p></nav>
</aside>
