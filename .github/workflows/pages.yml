name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.162.1
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
      - name: Check README directory
        run: python3 scripts/update_readme.py --check
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Verify site
        run: python3 scripts/verify_site.py
      - name: Upload download archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scene-card-downloads
          path: |
            .hugo-generated/downloads/manifest.json
            .hugo-generated/downloads/*.zip
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-hugo

  publish-downloads:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'zhaoolee/Improving-English-for-Programmers'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ZIP publisher
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/catalog.py
            scripts/downloads.py
            scripts/publish_downloads.py
          sparse-checkout-cone-mode: false
      - name: Download generated ZIP archives
        uses: actions/download-artifact@v4
        with:
          name: scene-card-downloads
          path: ${{ runner.temp }}/scene-card-downloads
      - name: Publish and verify ZIP direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_downloads.py publish --manifest "$RUNNER_TEMP/scene-card-downloads/manifest.json"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-downloads
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
